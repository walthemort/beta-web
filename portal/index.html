    <!--
      The moment before the app has loaded: the page is the right colour straight away, and the logo
      only fades in if loading takes a while. Colours match the tokens in src/styles.css.
    -->
    <style>
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #faf9f6; color: #16181b; }
      #boot > span { opacity: 0; animation: boot-in 0.4s 0.4s forwards, boot-pulse 1.6s 0.8s ease-in-out infinite; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-pulse { 50% { opacity: 0.45; } }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) #boot { background: #111110; color: #f2f1ec; } }
      html[data-theme='dark'] #boot { background: #111110; color: #f2f1ec; }
    </style>
    <script>
      // Members can pick light or dark for the studio app regardless of their device (saved by the app).
      // Set it before anything draws; the app's useTheme takes over from here.
      ;(function () {
        try {
          var theme = location.pathname.indexOf('/app') === 0 && localStorage.getItem('forme:theme')
          if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {}
      })()
    </script>
